{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card shadow-sm auth-card mx-auto mt-4"><div class="card-body p-4">
  <h1 class="h4 mb-3">Log in</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="mt-3 mb-0 small text-center">No account? <a href="{% url 'register' %}">Register</a></p>
</div></div>
{% endblock %}
