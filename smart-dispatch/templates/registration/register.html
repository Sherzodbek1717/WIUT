{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card shadow-sm auth-card mx-auto mt-4"><div class="card-body p-4">
  <h1 class="h4 mb-3">Create an account</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% for field in form %}{% include "_field.html" %}{% endfor %}
    <button class="btn btn-primary w-100">Register</button>
  </form>
  <p class="mt-3 mb-0 small text-center">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div></div>
{% endblock %}
