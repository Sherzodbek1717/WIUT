{% load ui %}<div class="mb-3{% if field|is_checkbox %} form-check{% endif %}">
  {% if field|is_checkbox %}
    {{ field|bootstrap }} <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
    {{ field|bootstrap }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
